<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Marchesato in Festa</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>.admin-shell{min-height:100vh;background:#f3f3f3}.admin-top{height:72px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.admin-top img{width:170px}.admin-wrap{width:min(1180px,calc(100% - 28px));margin:28px auto}.admin-grid{display:grid;grid-template-columns:220px 1fr;gap:24px}.admin-nav{background:#fff;border-radius:20px;padding:12px;height:max-content;position:sticky;top:96px}.admin-nav button{width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:12px;font-weight:800}.admin-nav button.active{background:#111;color:#fff}.panel{background:#fff;border-radius:22px;padding:24px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#f6f6f6;border-radius:16px;padding:18px}.kpi b{font:900 30px Montserrat}.admin-table{width:100%;border-collapse:collapse}.admin-table td,.admin-table th{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.login{min-height:100vh;display:grid;place-items:center;background:#111;padding:20px}.login-card{background:#fff;border-radius:24px;padding:28px;width:min(420px,100%)}@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.admin-nav{position:static;display:flex;overflow:auto}.admin-nav button{white-space:nowrap}.kpis{grid-template-columns:1fr 1fr}.panel{padding:16px}.admin-table{display:block;overflow:auto}}</style></head><body><div id="adminApp"></div><script src="/admin.js"></script></body></html>
