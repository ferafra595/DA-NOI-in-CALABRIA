<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Marchesato in Festa</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>
html,body{max-width:100%;overflow-x:hidden}.admin-shell{min-height:100vh;background:#f3f3f3;overflow-x:hidden}.admin-top{min-height:72px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;position:sticky;top:0;z-index:20}.admin-brand{display:flex;align-items:center;min-width:0}.admin-top img{width:170px;max-width:48vw;height:52px;object-fit:contain}.admin-wrap{width:min(1180px,calc(100% - 28px));margin:28px auto;min-width:0}.admin-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}.admin-grid>main{min-width:0;width:100%}.admin-nav{background:#fff;border-radius:20px;padding:12px;height:max-content;position:sticky;top:96px;min-width:0}.admin-nav button{width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:12px;font-weight:800}.admin-nav button.active{background:#111;color:#fff}.panel{background:#fff;border-radius:22px;padding:24px;min-width:0;max-width:100%;overflow:hidden}.panel .section-head{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{background:#f6f6f6;border-radius:16px;padding:18px;min-width:0}.kpi b{font:900 30px Montserrat}.admin-table{width:100%;border-collapse:collapse}.admin-table td,.admin-table th{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.login{min-height:100vh;display:grid;place-items:center;background:#111;padding:20px}.login-card{background:#fff;border-radius:24px;padding:28px;width:min(420px,100%);max-width:100%}.login-brand{display:block;width:230px;max-width:78%;margin:0 auto 24px}.login-brand img{display:block;width:100%;height:auto}.admin-like-form,.admin-like-form .field{min-width:0}.admin-like-form input,.admin-like-form select,.admin-like-form textarea{width:100%;max-width:100%;min-width:0}.upload-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,auto) auto;gap:8px;align-items:center;min-width:0}.upload-row input[type=file]{width:100%;max-width:100%;min-width:0}.admin-upload-preview{margin-top:10px;width:180px;height:110px;max-width:100%;object-fit:cover;border-radius:12px}.program-admin-day,.program-admin-days{min-width:0;max-width:100%}
@media(max-width:900px){.admin-grid{grid-template-columns:180px minmax(0,1fr);gap:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.upload-row{grid-template-columns:1fr}.upload-row .btn{width:100%}}
@media(max-width:700px){.admin-top{min-height:68px;padding:8px 14px}.admin-top img{width:145px;max-width:58vw;height:48px}.admin-top .btn{padding:10px 16px}.admin-wrap{width:calc(100% - 20px);margin:14px auto 28px}.admin-grid{display:block}.admin-nav{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:14px;padding:8px;border-radius:16px;overflow:hidden}.admin-nav button{min-width:0;padding:10px 9px;text-align:center;font-size:12px;line-height:1.2;white-space:normal}.panel{padding:16px;border-radius:18px;overflow:hidden}.panel .section-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}.panel .section-head>div{min-width:0;flex:1 1 180px}.panel .section-head h1{font-size:28px;line-height:1.05;margin-top:0}.panel .section-head .btn{flex:0 0 auto}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:14px}.kpi b{font-size:25px}.admin-table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.admin-table th,.admin-table td{white-space:nowrap}.admin-like-form{grid-template-columns:minmax(0,1fr)!important;width:100%;max-width:100%}.admin-like-form .field,.field.full{grid-column:auto!important;width:100%;max-width:100%}.field input,.field select,.field textarea{font-size:16px}.upload-row{display:grid;grid-template-columns:minmax(0,1fr);width:100%;max-width:100%}.upload-row input[type=file]{font-size:13px;padding:10px}.upload-row .btn{width:100%}.admin-upload-preview{width:150px;height:95px}.program-admin-head{align-items:flex-start}.program-admin-day{padding:12px!important}.program-admin-date{align-items:flex-start}.program-admin-date>span{flex:0 0 42px}.logo-size-admin{min-width:0!important}.logo-size-controls,.logo-size-preview,.preview-bar{min-width:0!important;max-width:100%}.login{padding:16px}.login-card{padding:24px 20px;border-radius:22px}.login-card h2{font-size:30px}}
@media(max-width:420px){.admin-nav{grid-template-columns:1fr 1fr}.admin-nav button{font-size:11px}.panel{padding:14px}.kpis{grid-template-columns:1fr}.admin-top img{width:135px}.login-brand{width:210px}}
</style></head><body><div id="adminApp"></div><script src="/admin.js"></script></body></html>
